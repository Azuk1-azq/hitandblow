<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot,
  collection, query, orderBy, serverTimestamp, arrayUnion, arrayRemove, writeBatch
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC5zRVd4XFEmNYTYnI_KJQ-YrNbwauqt6g",
  authDomain: "siomuraai.firebaseapp.com",
  projectId: "siomuraai",
  storageBucket: "siomuraai.firebasestorage.app",
  messagingSenderId: "243087403609",
  appId: "1:243087403609:web:fae22d9a088c6149bb9f48",
  measurementId: "G-QWGCMKVWWZ"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const DIGITS = 4;
let myUid = null, myName = "プレイヤー";
const app = document.getElementById("app");

function genCode(len = 5) { let s = ""; for (let i = 0; i < len; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }
function isValidDigits(str) { if (!/^\d{4}$/.test(str)) return false; return new Set(str.split("")).size === DIGITS; }
function calcHitBlow(secret, guess) {
  let hit = 0, blow = 0; const s = secret.split(""), g = guess.split("");
  for (let i = 0; i < DIGITS; i++) { if (g[i] === s[i]) hit++; else if (s.includes(g[i])) blow++; }
  return { hit, blow };
}
function escapeHtml(str) { return String(str ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function digitBoxesHtml(str) { return (str || "????").split("").map(d => `<div class="digit-box">${escapeHtml(d)}</div>`).join(""); }
function guessRowHtml(g, whoLabel) {
  const badges = (g.hit === null || g.hit === undefined)
    ? `<span class="badge pending">判定中...</span>`
    : `<span class="badge hit">HIT ${g.hit}</span><span class="badge blow">BLOW ${g.blow}</span>`;
  return `<div class="guess-row"><span class="who">${escapeHtml(whoLabel)}</span><span class="g-digits">${escapeHtml(g.guess)}</span><span class="badges">${badges}</span></div>`;
}
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function renderFatal(msg) {
  app.innerHTML = `<div class="error-msg">${escapeHtml(msg)}</div><button class="aero-btn wide" id="btnHome">最初からやり直す</button>`;
  document.getElementById("btnHome").onclick = () => { location.href = location.pathname; };
}

function ensureAuth() {
  return new Promise((resolve) => {
    onAuthStateChanged(auth, (user) => { if (user) { myUid = user.uid; resolve(user); } });
    signInAnonymously(auth).catch((e) => {
      renderFatal("Firebase匿名認証に失敗しました: " + e.message + "\n(Firebaseコンソールで Authentication > Sign-in method > 匿名 を有効にしてください)");
    });
  });
}

/* ==================== プレゼンス（在席確認）と自動退出判定 ==================== */
const PRESENCE_INTERVAL_MS = 2000;
const PRESENCE_TIMEOUT_MS = 5000;
let heartbeatTimer = null, presenceTickTimer = null, isJudging = false;

function lastSeenMillis(obj, uid) {
  const p = obj && obj.presence ? obj.presence[uid] : null;
  if (!p) return 0;
  if (typeof p.toMillis === "function") return p.toMillis();
  if (typeof p.seconds === "number") return p.seconds * 1000;
  return 0;
}
function isOnline(obj, uid) {
  if (!uid) return false;
  const t = lastSeenMillis(obj, uid);
  return t > 0 && (Date.now() - t) < PRESENCE_TIMEOUT_MS;
}
function presenceBadgeHtml(uid, src) {
  return `<span class="presence-badge" data-uid="${escapeHtml(uid)}" data-src="${src}"></span>`;
}
async function sendHeartbeat() {
  try {
    if ((mode === "solo" || mode === "team") && roomCode) {
      await updateDoc(doc(db, "rooms", roomCode), { [`presence.${myUid}`]: serverTimestamp() });
    }
    if (mode === "tournament" && tCode) {
      await updateDoc(doc(db, "tournaments", tCode), { [`presence.${myUid}`]: serverTimestamp() });
      if (myActiveMatchId) {
        await updateDoc(doc(db, "tournaments", tCode, "matches", myActiveMatchId), { [`presence.${myUid}`]: serverTimestamp() });
      }
    }
  } catch (e) { /* 接続が不安定な場合は無視 */ }
}
function startHeartbeat() { if (!heartbeatTimer) heartbeatTimer = setInterval(sendHeartbeat, PRESENCE_INTERVAL_MS); }
function startPresenceTicker() {
  if (presenceTickTimer) return;
  presenceTickTimer = setInterval(() => { updatePresenceBadges(); runAutoJudgment(); }, 1000);
}
function updatePresenceBadges() {
  document.querySelectorAll(".presence-badge[data-uid]").forEach((el) => {
    const uid = el.dataset.uid, src = el.dataset.src;
    let obj = null;
    if (src === "room") obj = roomData;
    else if (src === "trn") obj = tData;
    else if (src === "match") obj = tMatches.find(m => m.id === myActiveMatchId);
    const online = isOnline(obj, uid);
    el.textContent = online ? "オンライン" : "退出";
    el.className = "presence-badge " + (online ? "online" : "offline");
  });
}
async function runAutoJudgment() {
  if (isJudging) return;
  isJudging = true;
  try {
    // 個人戦：対戦中に相手が5秒応答なしなら自分の勝ちにする
    if (mode === "solo" && roomData && roomCode && (roomData.status === "setting" || roomData.status === "playing")) {
      const oppUid = roomData.player1Uid === myUid ? roomData.player2Uid : roomData.player1Uid;
      if (oppUid && !isOnline(roomData, oppUid)) {
        await updateDoc(doc(db, "rooms", roomCode), { status: "finished", winner: myUid, finishReason: "opponent_left" }).catch(() => {});
      }
    }
    // チーム戦：対戦中に相手チーム全員が5秒応答なしなら自チームの勝ちにする
    if (mode === "team" && roomData && roomCode && (roomData.status === "setting" || roomData.status === "playing")) {
      const mt = myTeamId();
      if (mt) {
        const otherTeam = mt === "teamA" ? "teamB" : "teamA";
        const otherOnline = (roomData[otherTeam].members || []).some(m => isOnline(roomData, m.uid));
        if (!otherOnline) {
          await updateDoc(doc(db, "rooms", roomCode), { status: "finished", winner: myUid, winnerTeam: mt, finishReason: "opponent_left" }).catch(() => {});
        }
      }
    }
    // チーム戦：メンバー募集中、ホストが5秒応答なしのメンバーを自動的に外す
    if (mode === "team" && roomData && roomCode && roomData.status === "waiting" && roomData.hostUid === myUid) {
      for (const teamId of ["teamA", "teamB"]) {
        const team = roomData[teamId];
        for (const m of (team.members || [])) {
          if (m.uid !== myUid && !isOnline(roomData, m.uid)) {
            await updateDoc(doc(db, "rooms", roomCode), {
              [`${teamId}.members`]: arrayRemove(m),
              [`${teamId}.memberUids`]: arrayRemove(m.uid)
            }).catch(() => {});
          }
        }
      }
    }
    // トーナメント：ロビーで5秒応答なしの参加者をホストが自動的に外す
    if (mode === "tournament" && tData && tCode && tData.status === "lobby" && tData.hostUid === myUid) {
      for (const p of tData.participants || []) {
        if (p.uid !== myUid && !isOnline(tData, p.uid)) {
          await updateDoc(doc(db, "tournaments", tCode), { participants: arrayRemove(p) }).catch(() => {});
        }
      }
    }
    // トーナメント：対戦中に相手が5秒応答なしなら自分の勝ちにする
    if (mode === "tournament" && tCode && myActiveMatchId) {
      const m = tMatches.find(x => x.id === myActiveMatchId);
      if (m && (m.status === "setting" || m.status === "playing")) {
        const oppUid = m.player1Uid === myUid ? m.player2Uid : m.player1Uid;
        if (oppUid && !isOnline(m, oppUid)) {
          await updateDoc(doc(db, "tournaments", tCode, "matches", myActiveMatchId), { status: "finished", winner: myUid, finishReason: "opponent_left" }).catch(() => {});
        }
      }
    }
  } finally { isJudging = false; }
}

/* ==================== 部屋/トーナメントの削除（所有者のみ） ==================== */
function ownerDeleteButtonHtml() {
  if (mode === "tournament") {
    if (!tData || tData.hostUid !== myUid) return "";
    return `<button class="aero-btn danger small" id="btnDeleteRoom" style="margin-bottom:14px;">トーナメントを削除する</button>`;
  }
  if (!roomData) return "";
  const isOwner = roomData.mode === "solo" ? roomData.player1Uid === myUid : roomData.hostUid === myUid;
  if (!isOwner) return "";
  return `<button class="aero-btn danger small" id="btnDeleteRoom" style="margin-bottom:14px;">部屋を削除する</button>`;
}
async function deleteRoomCascade(code) {
  const rSnap = await getDoc(doc(db, "rooms", code));
  const rd = rSnap.exists() ? rSnap.data() : null;
  const gSnap = await getDocs(collection(db, "rooms", code, "guesses"));
  await Promise.all(gSnap.docs.map(d => deleteDoc(d.ref).catch(() => {})));
  if (rd && rd.mode === "solo") {
    const uids = [rd.player1Uid, rd.player2Uid].filter(Boolean);
    await Promise.all(uids.map(u => deleteDoc(doc(db, "rooms", code, "secrets", u)).catch(() => {})));
  } else if (rd) {
    await Promise.all(["teamA", "teamB"].map(t => deleteDoc(doc(db, "rooms", code, "teamSecrets", t)).catch(() => {})));
  }
  await deleteDoc(doc(db, "rooms", code));
}
async function deleteTournamentCascade(code) {
  const mSnap = await getDocs(collection(db, "tournaments", code, "matches"));
  for (const mDoc of mSnap.docs) {
    const md = mDoc.data();
    const gSnap = await getDocs(collection(db, "tournaments", code, "matches", mDoc.id, "guesses"));
    await Promise.all(gSnap.docs.map(d => deleteDoc(d.ref).catch(() => {})));
    const uids = [md.player1Uid, md.player2Uid].filter(Boolean);
    await Promise.all(uids.map(u => deleteDoc(doc(db, "tournaments", code, "matches", mDoc.id, "secrets", u)).catch(() => {})));
    await deleteDoc(mDoc.ref).catch(() => {});
  }
  await deleteDoc(doc(db, "tournaments", code));
}

async function soloCreateRoom(name) {

  throw new Error("ルームコードの生成に失敗しました。もう一度お試しください。");

async function soloJoinRoom(code, name) {
  code = code.trim().toUpperCase(); if (!code) throw new Error("ルームコードを入力してください");
  myName = name || "ゲスト";
  const ref = doc(db, "rooms", code); const snap = await getDoc(ref);
  if (!snap.exists()) throw new Error("そのルームコードは見つかりません");
  const data = snap.data();
  if (data.mode !== "solo") throw new Error("このコードは個人戦のルームではありません");
  if (data.player1Uid === myUid || data.player2Uid === myUid) { roomCode = code; history.replaceState(null, "", "?room=" + code); soloSubscribe(code); sendHeartbeat(); return; }
  if (data.player2Uid) throw new Error("このルームは満室です");
  await updateDoc(ref, { player2Uid: myUid, player2Name: myName, status: "setting" });
  roomCode = code; history.replaceState(null, "", "?room=" + code); soloSubscribe(code); sendHeartbeat();
}
function soloSubscribe(code) {
  if (unsubRoom) unsubRoom(); if (unsubGuesses) unsubGuesses();
  const roomRef = doc(db, "rooms", code);
  unsubRoom = onSnapshot(roomRef, (snap) => {
    if (!snap.exists()) { renderFatal("ルームが削除されたか見つかりません。"); return; }
    roomData = snap.data();
    if (roomData.player1Uid === myUid && roomData.status === "setting" && (roomData.readyUids || []).length >= 2 && !roomData.turn && !hostLock) {
      hostLock = true;
      updateDoc(roomRef, { status: "playing", turn: roomData.player1Uid }).finally(() => { hostLock = false; });
    }
    render();
  }, (err) => renderFatal("監視エラー: " + err.message));

  const gq = query(collection(db, "rooms", code, "guesses"), orderBy("createdAt", "asc"));
  unsubGuesses = onSnapshot(gq, (snap) => {
    snap.docChanges().forEach(async (change) => {
      if (change.type !== "added") return;
      const g = change.doc.data(), gid = change.doc.id;
      if (g.targetUid === myUid && g.hit === null) {
        const secretSnap = await getDoc(doc(db, "rooms", code, "secrets", myUid));
        const secret = secretSnap.exists() ? secretSnap.data().secret : null;
        if (!secret) return;
        const { hit, blow } = calcHitBlow(secret, g.guess);
        await updateDoc(doc(db, "rooms", code, "guesses", gid), { hit, blow, evaluatedAt: serverTimestamp() });
        if (hit === DIGITS) await updateDoc(roomRef, { status: "finished", winner: g.guesserUid });
        else await updateDoc(roomRef, { turn: myUid });
      }
    });
    allGuesses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}

let myTeamSecretCache = { code: null, teamId: null, val: null };

function myTeamId() {
  if (!roomData || roomData.mode !== "team") return null;
  if ((roomData.teamA?.memberUids || []).includes(myUid)) return "teamA";
  if ((roomData.teamB?.memberUids || []).includes(myUid)) return "teamB";
  return null;
}
async function teamCreateRoom(name, teamSize) {
  myName = name || "ホスト";
  for (let i = 0; i < 8; i++) {
    const code = genCode();
    const ref = doc(db, "rooms", code);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, {
        mode: "team", teamSize, hostUid: myUid, status: "waiting",
        teamA: { name: "チームA", members: [{ uid: myUid, name: myName }], memberUids: [myUid], ptr: 0 },
        teamB: { name: "チームB", members: [], memberUids: [], ptr: 0 },
        readyTeams: [], turn: null, turnTeam: null, winner: null, winnerTeam: null, finishReason: null, presence: {}, createdAt: serverTimestamp()
      });
      roomCode = code; history.replaceState(null, "", "?room=" + code); teamSubscribe(code); sendHeartbeat(); return;
    }
  }
  throw new Error("ルームコードの生成に失敗しました。");
}
async function teamJoinRoom(code, name, teamChoice) {
  code = code.trim().toUpperCase(); if (!code) throw new Error("ルームコードを入力してください");
  myName = name || "ゲスト";
  const ref = doc(db, "rooms", code); const snap = await getDoc(ref);
  if (!snap.exists()) throw new Error("そのルームコードは見つかりません");
  const data = snap.data();
  if (data.mode !== "team") throw new Error("このコードはチーム戦のルームではありません");
  if ((data.teamA.memberUids || []).includes(myUid) || (data.teamB.memberUids || []).includes(myUid)) {
    roomCode = code; history.replaceState(null, "", "?room=" + code); teamSubscribe(code); sendHeartbeat(); return;
  }
  if (data.status !== "waiting") throw new Error("このルームは既に開始されています");
  const team = data[teamChoice];
  if ((team.members || []).length >= data.teamSize) throw new Error("そのチームは満員です");
  await updateDoc(ref, {
    [`${teamChoice}.members`]: arrayUnion({ uid: myUid, name: myName }),
    [`${teamChoice}.memberUids`]: arrayUnion(myUid)
  });
  roomCode = code; history.replaceState(null, "", "?room=" + code); teamSubscribe(code); sendHeartbeat();
}
function teamSubscribe(code) {
  if (unsubRoom) unsubRoom(); if (unsubGuesses) unsubGuesses();
  const roomRef = doc(db, "rooms", code);
  unsubRoom = onSnapshot(roomRef, (snap) => {
    if (!snap.exists()) { renderFatal("ルームが削除されたか見つかりません。"); return; }
    roomData = snap.data();
    if (roomData.hostUid === myUid && roomData.status === "setting" && (roomData.readyTeams || []).length >= 2 && !roomData.turn && !hostLock) {
      hostLock = true;
      updateDoc(roomRef, { status: "playing", turnTeam: "teamA", turn: roomData.teamA.members[0].uid }).finally(() => { hostLock = false; });
    }
    render();
  }, (err) => renderFatal("監視エラー: " + err.message));

  const gq = query(collection(db, "rooms", code, "guesses"), orderBy("createdAt", "asc"));
  unsubGuesses = onSnapshot(gq, (snap) => {
    snap.docChanges().forEach(async (change) => {
      if (change.type !== "added") return;
      const g = change.doc.data(), gid = change.doc.id;
      const mt = myTeamId();
      if (mt && g.targetTeam === mt && g.hit === null) {
        const secretSnap = await getDoc(doc(db, "rooms", code, "teamSecrets", mt));
        const secret = secretSnap.exists() ? secretSnap.data().secret : null;
        if (!secret) return;
        const { hit, blow } = calcHitBlow(secret, g.guess);
        await updateDoc(doc(db, "rooms", code, "guesses", gid), { hit, blow, evaluatedAt: serverTimestamp() });
        if (hit === DIGITS) {
          await updateDoc(roomRef, { status: "finished", winner: g.guesserUid, winnerTeam: g.guesserTeam });
        } else {
          const attackerTeam = g.guesserTeam;
          const newPtr = (roomData[attackerTeam].ptr || 0) + 1;
          const defenderPtr = roomData[mt].ptr || 0;
          const nextUid = roomData[mt].members[defenderPtr % roomData[mt].members.length].uid;
          await updateDoc(roomRef, { [`${attackerTeam}.ptr`]: newPtr, turnTeam: mt, turn: nextUid });
        }
      }
    });
    allGuesses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}

  await setDoc(doc(db, "rooms", code, "teamSecrets", teamId), { secret: digits, setByUid: myUid, createdAt: serverTimestamp() });
  myTeamSecretCache = { code, teamId, val: digits };
  await updateDoc(doc(db, "rooms", code), { readyTeams: arrayUnion(teamId) });

}

   トーナメント戦 (TOURNAMENT)
===================================================================== */
let tCode = null, tData = null, tMatches = [], unsubT = null, unsubTMatches = null;
let myActiveMatchId = null, unsubMatchGuesses = null, matchGuesses = [];
let tHostLock = false; const advancingLocks = new Set();
let matchSecretCache = { matchId: null, uid: null, val: null };

async function trnCreate(name, size) {
  myName = name || "ホスト";
  for (let i = 0; i < 8; i++) {
    const code = genCode();
    const ref = doc(db, "tournaments", code);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, { hostUid: myUid, size, participants: [{ uid: myUid, name: myName }], status: "lobby", champion: null, presence: {}, createdAt: serverTimestamp() });
      tCode = code; history.replaceState(null, "", "?trn=" + code); trnSubscribe(code); sendHeartbeat(); return;
    }
  }
  throw new Error("コードの生成に失敗しました。");
}
async function trnJoin(code, name) {
  code = code.trim().toUpperCase(); if (!code) throw new Error("コードを入力してください");
  myName = name || "ゲスト";
  const ref = doc(db, "tournaments", code); const snap = await getDoc(ref);
  if (!snap.exists()) throw new Error("そのコードは見つかりません");
  const data = snap.data();
  if ((data.participants || []).some(p => p.uid === myUid)) { tCode = code; history.replaceState(null, "", "?trn=" + code); trnSubscribe(code); sendHeartbeat(); return; }
  if (data.status !== "lobby") throw new Error("このトーナメントは既に開始されています");
  if ((data.participants || []).length >= data.size) throw new Error("トーナメントは満員です");
  await updateDoc(ref, { participants: arrayUnion({ uid: myUid, name: myName }) });
  tCode = code; history.replaceState(null, "", "?trn=" + code); trnSubscribe(code); sendHeartbeat();
}
function buildBracket(participants) {
  const n = participants.length, rounds = Math.log2(n), shuffled = shuffle(participants);
  const matches = []; let roundSize = n / 2;
  for (let i = 0; i < roundSize; i++) matches.push({ id: `r1m${i}`, round: 1, index: i, player1: shuffled[i * 2], player2: shuffled[i * 2 + 1] });
  let prevSize = roundSize;
  for (let r = 2; r <= rounds; r++) { const size = prevSize / 2; for (let i = 0; i < size; i++) matches.push({ id: `r${r}m${i}`, round: r, index: i, player1: null, player2: null }); prevSize = size; }
  for (const m of matches) { if (m.round === rounds) continue; m.nextMatchId = `r${m.round + 1}m${Math.floor(m.index / 2)}`; m.nextSlot = (m.index % 2 === 0) ? "player1" : "player2"; }
  return matches;
}
async function trnStart() {
  const bracket = buildBracket(tData.participants);
  const batch = writeBatch(db);
  for (const m of bracket) {
    const ref = doc(db, "tournaments", tCode, "matches", m.id);
    batch.set(ref, {
      round: m.round, index: m.index,
      player1Uid: m.player1?.uid || null, player1Name: m.player1?.name || null,
      player2Uid: m.player2?.uid || null, player2Name: m.player2?.name || null,
      status: (m.player1 && m.player2) ? "setting" : "pending",
      readyUids: [], turn: null, winner: null, finishReason: null, presence: {},
      nextMatchId: m.nextMatchId || null, nextSlot: m.nextSlot || null, createdAt: serverTimestamp()
    });
  }
  await batch.commit();
  await updateDoc(doc(db, "tournaments", tCode), { status: "in_progress" });
}
function trnSubscribe(code) {
  if (unsubT) unsubT(); if (unsubTMatches) unsubTMatches();
  const tRef = doc(db, "tournaments", code);
  unsubT = onSnapshot(tRef, (snap) => { if (!snap.exists()) { renderFatal("トーナメントが見つかりません。"); return; } tData = snap.data(); render(); });

  unsubTMatches = onSnapshot(collection(db, "tournaments", code, "matches"), (snap) => {
    tMatches = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    // ホストは進行管理を担当：pending→setting、finished→次戦への勝者反映、決勝終了→優勝確定
    if (tData && tData.hostUid === myUid) {
      for (const m of tMatches) {
        if (m.status === "setting" && (m.readyUids || []).length >= 2 && !m.turn && !advancingLocks.has(m.id + ":turn")) {
          advancingLocks.add(m.id + ":turn");
          updateDoc(doc(db, "tournaments", code, "matches", m.id), { status: "playing", turn: m.player1Uid }).finally(() => advancingLocks.delete(m.id + ":turn"));
        }
        if (m.status === "pending" && m.player1Uid && m.player2Uid && !advancingLocks.has(m.id + ":pend")) {
          advancingLocks.add(m.id + ":pend");
          updateDoc(doc(db, "tournaments", code, "matches", m.id), { status: "setting" }).finally(() => advancingLocks.delete(m.id + ":pend"));
        }
        if (m.status === "finished" && m.winner && m.nextMatchId && !advancingLocks.has(m.id + ":next")) {
          const next = tMatches.find(x => x.id === m.nextMatchId);
          const slotUidKey = m.nextSlot + "Uid", slotNameKey = m.nextSlot + "Name";
          if (next && !next[slotUidKey]) {
            advancingLocks.add(m.id + ":next");
            const winnerName = m.player1Uid === m.winner ? m.player1Name : m.player2Name;
            updateDoc(doc(db, "tournaments", code, "matches", m.nextMatchId), { [slotUidKey]: m.winner, [slotNameKey]: winnerName }).finally(() => advancingLocks.delete(m.id + ":next"));
          }
        }
        if (m.status === "finished" && m.winner && !m.nextMatchId && tData.status !== "finished" && !advancingLocks.has("champion")) {
          advancingLocks.add("champion");
          const winnerName = m.player1Uid === m.winner ? m.player1Name : m.player2Name;
          updateDoc(tRef, { status: "finished", champion: { uid: m.winner, name: winnerName } }).finally(() => advancingLocks.delete("champion"));
        }
      }
    }

    const active = tMatches.find(m => (m.player1Uid === myUid || m.player2Uid === myUid) && m.status !== "finished");
    const newActiveId = active ? active.id : null;
    if (newActiveId !== myActiveMatchId) {
      myActiveMatchId = newActiveId;
      if (unsubMatchGuesses) { unsubMatchGuesses(); unsubMatchGuesses = null; }
      matchGuesses = [];
      if (myActiveMatchId) { trnSubscribeMatchGuesses(code, myActiveMatchId); sendHeartbeat(); }
    }
    render();
  });
}
function trnSubscribeMatchGuesses(code, matchId) {
  const matchRef = doc(db, "tournaments", code, "matches", matchId);
  const gq = query(collection(db, "tournaments", code, "matches", matchId, "guesses"), orderBy("createdAt", "asc"));
  unsubMatchGuesses = onSnapshot(gq, (snap) => {
    snap.docChanges().forEach(async (change) => {
      if (change.type !== "added") return;
      const g = change.doc.data(), gid = change.doc.id;
      if (g.targetUid === myUid && g.hit === null) {
        const secretSnap = await getDoc(doc(db, "tournaments", code, "matches", matchId, "secrets", myUid));
        const secret = secretSnap.exists() ? secretSnap.data().secret : null;
        if (!secret) return;
        const { hit, blow } = calcHitBlow(secret, g.guess);
        await updateDoc(doc(db, "tournaments", code, "matches", matchId, "guesses", gid), { hit, blow, evaluatedAt: serverTimestamp() });
        if (hit === DIGITS) await updateDoc(matchRef, { status: "finished", winner: g.guesserUid });
        else await updateDoc(matchRef, { turn: myUid });
      }
    });
    matchGuesses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}
async function trnSetSecret(code, matchId, digits) {
  await setDoc(doc(db, "tournaments", code, "matches", matchId, "secrets", myUid), { secret: digits, createdAt: serverTimestamp() });
  matchSecretCache = { matchId, uid: myUid, val: digits };

  const targetUid = matchData.player1Uid === myUid ? matchData.player2Uid : matchData.player1Uid;

  });

async function getMatchSecretCached(matchId) {
  if (matchSecretCache.matchId === matchId && matchSecretCache.uid === myUid && matchSecretCache.val) return matchSecretCache.val;

function bracketHtml() {
  if (!tMatches.length) return "";
  const rounds = Math.max(...tMatches.map(m => m.round));
  let html = `<div class="bracket">`;
  for (let r = 1; r <= rounds; r++) {
    const ms = tMatches.filter(m => m.round === r).sort((a, b) => a.index - b.index);
    html += `<div class="bracket-round"><div class="rlabel">${r === rounds ? "決勝" : `ラウンド${r}`}</div>`;
    for (const m of ms) {
      const p1 = m.player1Name || "TBD", p2 = m.player2Name || "TBD";
      const p1cls = m.status === "finished" && m.winner === m.player1Uid ? "win" : (m.player1Name ? "" : "tbd");
      const p2cls = m.status === "finished" && m.winner === m.player2Uid ? "win" : (m.player2Name ? "" : "tbd");
      html += `<div class="bracket-match"><div class="bp ${p1cls}">${escapeHtml(p1)}</div><div class="bp ${p2cls}">${escapeHtml(p2)}</div></div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

      <div class="copy-row"><input class="aero-input" id="shareUrl" readonly value="${escapeHtml(shareUrl)}"><button class="aero-btn" id="btnCopy">コピー</button></div></div>
    <div class="glass-panel"><div class="sub" style="margin-bottom:6px;">参加者一覧</div>
      ${tData.participants.map(p => `<div class="team-member">${escapeHtml(p.name)}${p.uid === tData.hostUid ? " (ホスト)" : ""}</div>`).join("")}</div>
    ${tData.hostUid === myUid
      ? `<button class="aero-btn wide" id="btnStart" ${canStart ? "" : "disabled"}>抽選してトーナメント開始</button><div class="hint">${tData.size}人揃うと開始できます</div>`
      : `<div class="spinner"></div><div class="sub center">ホストが開始するのをお待ちください</div>`}`;
  document.getElementById("btnCopy").onclick = () => {
    navigator.clipboard.writeText(shareUrl).then(() => { const b = document.getElementById("btnCopy"); b.textContent = "コピーしました！"; setTimeout(() => b.textContent = "コピー", 1500); });
  };
  const startBtn = document.getElementById("btnStart");
  if (startBtn) startBtn.onclick = async () => { startBtn.disabled = true; try { await trnStart(); } catch (e) { renderTrnGathering(); alert(e.message); } };
}
async function renderTrnSetting(m) {
  const already = (m.readyUids || []).includes(myUid);
  const oppName = m.player1Uid === myUid ? m.player2Name : m.player1Name;
  let bodyHtml;
  if (already) {
    const secret = await getMatchSecretCached(m.id);
    bodyHtml = `<h2>合言葉を設定しました</h2><div class="glass-panel center"><div class="digit-boxes">${digitBoxesHtml(secret)}</div></div>
      <div class="spinner"></div><div class="sub center">${escapeHtml(oppName || "相手")} の準備をお待ちください...</div>`;
  } else {
    bodyHtml = `<h2>${escapeHtml(oppName || "相手")} 戦：合言葉を設定してください</h2>
      <div class="sub">重複のない4桁の数字を決めましょう。</div>
      <div class="field"><input class="aero-input" id="inSecret" maxlength="4" inputmode="numeric" placeholder="4桁の数字（重複なし）" style="text-align:center;font-size:24px;letter-spacing:10px;"></div>
      <div id="secErr"></div><button class="aero-btn wide" id="btnSetSecret">決定</button>`;
  }
  app.innerHTML = `<div class="glass-panel" style="margin-bottom:12px;"><div class="sub" style="margin:0;">ラウンド${m.round} の対戦</div></div>` + bodyHtml + `<h3 style="margin-top:18px;">トーナメント表</h3>${bracketHtml()}`;
  const input = document.getElementById("inSecret");
  if (input) {
    input.oninput = () => { input.value = input.value.replace(/[^0-9]/g, "").slice(0, 4); };
    document.getElementById("btnSetSecret").onclick = async () => {
      const v = input.value, errBox = document.getElementById("secErr");
      if (!isValidDigits(v)) { errBox.innerHTML = `<div class="error-msg">4桁の「重複しない」数字を入力してください</div>`; return; }
      document.getElementById("btnSetSecret").disabled = true;
      try { await trnSetSecret(tCode, m.id, v); } catch (e) { errBox.innerHTML = `<div class="error-msg">${escapeHtml(e.message)}</div>`; document.getElementById("btnSetSecret").disabled = false; }
    };
  }
}
async function renderTrnGame(m) {
  const myTurn = m.turn === myUid;
  const oppName = m.player1Uid === myUid ? m.player2Name : m.player1Name;
  const secret = await getMatchSecretCached(m.id);
  const historyHtml = matchGuesses.slice().reverse().map(g => guessRowHtml(g, g.guesserUid === myUid ? "あなた" : (g.guesserName || "相手"))).join("");
  app.innerHTML = `
    <div class="glass-panel" style="margin-bottom:12px;"><div class="sub" style="margin:0;">ラウンド${m.round} の対戦</div></div>
    <div class="players"><div class="player-chip">${escapeHtml(m.player1Name)} ${m.player1Uid === myUid ? "(あなた)" : ""}</div><div class="player-chip">${escapeHtml(m.player2Name)} ${m.player2Uid === myUid ? "(あなた)" : ""}</div></div>
    <div class="turn-badge ${myTurn ? "mine" : "theirs"}">${myTurn ? "あなたの番です" : `${escapeHtml(oppName || "相手")} の番です`}</div>
    <div class="glass-panel"><div class="field" style="margin-bottom:6px;"><label>あなたの合言葉</label></div><div class="digit-boxes">${digitBoxesHtml(secret)}</div></div>
    <div class="field"><label>予想する数字（4桁・重複なし）</label>
      <div class="row"><input class="aero-input" id="inGuess" maxlength="4" inputmode="numeric" placeholder="1234" style="text-align:center;font-size:20px;letter-spacing:8px;" ${myTurn ? "" : "disabled"}>
      <button class="aero-btn" id="btnGuess" ${myTurn ? "" : "disabled"}>予想する</button></div><div id="guessErr"></div></div>
    <h3 style="margin-top:18px;">対戦履歴</h3><div class="history">${historyHtml || `<div class="sub">まだ予想はありません</div>`}</div>
    <h3 style="margin-top:18px;">トーナメント表</h3>${bracketHtml()}`;
  const input = document.getElementById("inGuess");
  input.oninput = () => { input.value = input.value.replace(/[^0-9]/g, "").slice(0, 4); };
  const btn = document.getElementById("btnGuess");
  if (btn) btn.onclick = async () => {
    const v = input.value, errBox = document.getElementById("guessErr");
    if (!isValidDigits(v)) { errBox.innerHTML = `<div class="error-msg">4桁の「重複しない」数字を入力してください</div>`; return; }
    btn.disabled = true;
    try { await trnSubmitGuess(tCode, m.id, m, v); input.value = ""; } catch (e) { errBox.innerHTML = `<div class="error-msg">${escapeHtml(e.message)}</div>`; }
    btn.disabled = false;
  };
}
function renderTrnWaitingBracket() {
  const myFinishedLoss = tMatches.some(m => m.status === "finished" && (m.player1Uid === myUid || m.player2Uid === myUid) && m.winner !== myUid);
  const stillIn = tMatches.some(m => (m.player1Uid === myUid || m.player2Uid === myUid) && m.status !== "finished") ||
                   (myFinishedLoss ? false : tMatches.some(m => m.status === "finished" && m.winner === myUid && !m.nextMatchId));
  app.innerHTML = `
    <h2>${myFinishedLoss ? "あなたは敗退しました" : "次の対戦をお待ちください"}</h2>
    <div class="sub">${myFinishedLoss ? "引き続き他の対戦の行方を見守りましょう。" : "対戦相手が決まり次第、合言葉の設定に進みます。"}</div>
    <div class="spinner"></div>
    <h3 style="margin-top:18px;">トーナメント表</h3>${bracketHtml()}`;
}
function renderTrnFinished() {
  const iAmChampion = tData.champion && tData.champion.uid === myUid;
  app.innerHTML = `
    <div class="result-banner ${iAmChampion ? "win" : "lose"}"> 優勝: ${escapeHtml(tData.champion?.name || "?")} ${iAmChampion ? "（あなた！）" : ""}</div>
    <button class="aero-btn wide" id="btnAgain">モード選択に戻る</button>
    <h3 style="margin-top:18px;">最終トーナメント表</h3>${bracketHtml()}`;
  document.getElementById("btnAgain").onclick = goHome;
}

/* ==================== 起動 ==================== */
document.addEventListener("click", (e) => {
  if (e.target && e.target.id === "btnClose") { if (confirm("最初の画面に戻りますか？")) goHome(); }
});

(async function boot() {
  await ensureAuth();
  const params = new URLSearchParams(location.search);
  const roomFromUrl = params.get("room");
  const trnFromUrl = params.get("trn");
  try {
    if (roomFromUrl) {
      const ref = doc(db, "rooms", roomFromUrl.toUpperCase());
      const snap = await getDoc(ref);
      if (snap.exists()) {
        const data = snap.data();
        const uidsInRoom = data.mode === "team"
          ? [...(data.teamA.memberUids || []), ...(data.teamB.memberUids || [])]
          : [data.player1Uid, data.player2Uid];
        if (uidsInRoom.includes(myUid)) {
          mode = data.mode; roomCode = roomFromUrl.toUpperCase(); myName = myName;
          if (mode === "solo") soloSubscribe(roomCode); else teamSubscribe(roomCode);
          return;
        }
      }
    } else if (trnFromUrl) {
      const ref = doc(db, "tournaments", trnFromUrl.toUpperCase());
      const snap = await getDoc(ref);
      if (snap.exists()) {
        const data = snap.data();
        if ((data.participants || []).some(p => p.uid === myUid)) {
          mode = "tournament"; tCode = trnFromUrl.toUpperCase();
          trnSubscribe(tCode);
          return;
        }
      }
    }
  } catch (e) { /* fall through to mode select */ }
  render();
})();
</script>
</body>
